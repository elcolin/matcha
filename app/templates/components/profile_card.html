<div class="col-md-4">
    <div class="card profile-card shadow-sm">
        <img src="{{ profile.image }}" class="card-img-top">
        <div class="card-body text-center">
            <h5>{{ profile.name }}, {{ profile.age }}</h5>
            <p class="text-muted">{{ profile.city }} • {{ profile.neighborhood }}</p>
            <p class="online-status">
                <span class="online-indicator {{ 'online' if profile.online else 'offline' }}"></span>
                {{ 'Online' if profile.online else 'Offline' }}
            </p>
            <a href="{{ url_for('profile.detail', id=profile.id) }}"
               class="btn btn-outline-danger btn-sm">View</a>
        </div>
    </div>
</div>
