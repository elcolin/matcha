<form method="get" action="{{ action }}" class="row g-2 mb-4 align-items-end">
    <div class="col-6 col-md-auto">
        <label class="form-label" for="min_age">Min age</label>
        <input class="form-control" type="number" min="18" max="120" id="min_age" name="min_age" value="{{ args.get('min_age', '') }}">
    </div>
    <div class="col-6 col-md-auto">
        <label class="form-label" for="max_age">Max age</label>
        <input class="form-control" type="number" min="18" max="120" id="max_age" name="max_age" value="{{ args.get('max_age', '') }}">
    </div>
    <div class="col-12 col-md-auto">
        <label class="form-label" for="city">City</label>
        <input class="form-control" type="text" maxlength="100" id="city" name="city" value="{{ args.get('city', '') }}">
    </div>
    <div class="col-6 col-md-auto">
        <label class="form-label" for="min_popularity">Min popularity</label>
        <input class="form-control" type="number" min="0" id="min_popularity" name="min_popularity" value="{{ args.get('min_popularity', '') }}">
    </div>
    <div class="col-6 col-md-auto">
        <label class="form-label" for="max_popularity">Max popularity</label>
        <input class="form-control" type="number" min="0" id="max_popularity" name="max_popularity" value="{{ args.get('max_popularity', '') }}">
    </div>
    <div class="col-12 col-md-auto">
        <label class="form-label" for="tags">Tags</label>
        <input class="form-control" type="text" maxlength="200" id="tags" name="tags" value="{{ args.get('tags', '') }}" placeholder="music, hiking">
    </div>
    <div class="col-6 col-md-auto">
        <label class="form-label" for="sort_by">Sort by</label>
        <select class="form-select" id="sort_by" name="sort_by">
            {% for value, label in [('smart', 'Smart match'), ('age', 'Age'), ('location', 'Distance'), ('popularity', 'Fame rating'), ('tags', 'Shared tags')] %}
                <option value="{{ value }}" {% if args.get('sort_by', 'smart') == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-6 col-md-auto">
        <label class="form-label" for="order">Order</label>
        <select class="form-select" id="order" name="order">
            <option value="asc" {% if args.get('order') == 'asc' %}selected{% endif %}>Ascending</option>
            <option value="desc" {% if args.get('order', 'desc') == 'desc' %}selected{% endif %}>Descending</option>
        </select>
    </div>
    <div class="col-12 col-md-auto d-flex gap-2">
        <button type="submit" class="btn btn-danger">{{ submit_label }}</button>
        <a href="{{ action }}" class="btn btn-outline-secondary">Reset</a>
    </div>
</form>
